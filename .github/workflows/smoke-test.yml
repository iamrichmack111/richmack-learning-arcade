name: Arcade Smoke Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate arcade structure
        run: python3 scripts/validate_arcade.py

      - name: HTTP smoke test
        run: python3 scripts/smoke_test.py
