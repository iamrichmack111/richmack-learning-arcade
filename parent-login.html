<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Login • Richmack Learning Arcade</title><link rel="stylesheet" href="arcade.css"></head><body><main class="portal-login"><section class="portal-card"><span class="eyebrow">PARENT ACCESS</span><h1>Parent Portal</h1><p class="portal-muted">Enter the parent PIN to view grades and play time stored in this browser.</p><form id="loginForm" class="portal-form"><input id="pin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Parent PIN" required><button class="portal-btn">Log in</button></form><p id="error" class="portal-error"></p><p class="portal-muted">Local test PIN: <strong>2468</strong>. Change it inside the portal before deployment.</p><p><a href="index.html">← Back to Login</a></p></section></main><script>const f=document.getElementById('loginForm');f.onsubmit=e=>{e.preventDefault();const saved=localStorage.getItem('richmackParentPin')||'2468';if(document.getElementById('pin').value===saved){sessionStorage.setItem('richmackParentAuth','1');location.href='parent-portal.html'}else document.getElementById('error').textContent='Incorrect PIN.'}</script></body></html>
